<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic CAD Studio</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="wordmark">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 3 3 8l9 5 9-5-9-5Zm-9 5v8l9 5 9-5V8M12 13v8"/></svg>
    <span>Agentic CAD Studio</span>
  </div>
  <label class="model-picker">
    <span class="visually-hidden">Model</span>
    <select id="model-select" aria-label="Model"></select>
  </label>
  <div class="topbar-status" aria-live="polite">
    <span id="status-pill" class="pill pill-pending">building…</span>
  </div>
</header>

<main class="workbench">
  <section class="rail" aria-label="Parameters">
    <h2 class="rail-title">Parameters</h2>
    <div id="params"></div>
    <p class="rail-hint">Every change rebuilds the model and re-runs the
    interference, feature-graph and context checks before it is shown.</p>
  </section>

  <section class="viewport" aria-label="3D preview">
    <canvas id="view" width="800" height="600"></canvas>
    <div class="viewport-legend">
      <span id="vp-dims" class="dims" aria-hidden="true"></span>
    </div>
    <p class="viewport-hint">drag to orbit · wheel to zoom · double-click to reset</p>
  </section>

  <section class="panel" aria-label="Validation">
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-checks" aria-controls="pane-checks" aria-selected="true" class="tab is-active">Checks</button>
      <button role="tab" id="tab-graph" aria-controls="pane-graph" aria-selected="false" class="tab">Graph</button>
      <button role="tab" id="tab-context" aria-controls="pane-context" aria-selected="false" class="tab">Context</button>
    </nav>
    <div class="panes">
      <div id="pane-checks" role="tabpanel" aria-labelledby="tab-checks" class="pane is-active">
        <div id="error-summary" class="error-summary" hidden></div>
        <div id="checks-body" class="checks-body"></div>
      </div>
      <div id="pane-graph" role="tabpanel" aria-labelledby="tab-graph" class="pane">
        <pre id="graph-body" class="mono-pre">no graph yet</pre>
      </div>
      <div id="pane-context" role="tabpanel" aria-labelledby="tab-context" class="pane">
        <pre id="context-body" class="mono-pre">no context yet</pre>
      </div>
    </div>
  </section>
</main>

<footer class="strip">
  <span id="strip-rebuild">–</span>
  <span id="strip-mesh">–</span>
  <span id="strip-assumptions">–</span>
  <span class="strip-spacer"></span>
  <span id="strip-api" class="strip-api">agent API: POST /api/build</span>
</footer>

<noscript><p class="noscript">The Studio needs JavaScript — it drives the model through POST /api/build.</p></noscript>
<script src="/static/app.js"></script>
</body>
</html>
